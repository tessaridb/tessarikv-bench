[package]
name = "tessarikv-bench"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["TessariDB", "boogvar"]
description = "Benchmarks of the TessariKV storage engine: block cache scaling, block search, compression and write amplification against RocksDB."
repository = "https://github.com/tessaridb/tessarikv-bench"
homepage = "https://github.com/tessaridb/tessarikv-bench"
publish = false

[dependencies]
tessarikv-sync = "0.1.1"
tessarikv-format = "0.1.1"
tessarikv = "0.1.1"
tessarikv-types = "0.1.1"
tokio = { version = "1.53.3", default-features = false, features = ["rt-multi-thread", "time"] }
hdrhistogram = { version = "7.5.4", default-features = false }
rocksdb = { version = "0.25.0", default-features = false, features = ["bindgen-runtime", "lz4"] }

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
